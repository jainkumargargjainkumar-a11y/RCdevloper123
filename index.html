<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeminiX Pro AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #050505; --neon: #00ffa3; --card: #0d0d0d; --text: #ffffff; }
        body.light-theme { --bg: #f5f5f5; --card: #ffffff; --text: #1a1a1a; --neon: #2563eb; }
        
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: 0.3s; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        
        #app { width: 100%; max-width: 600px; display: flex; flex-direction: column; background: var(--card); border-left: 1px solid #333; border-right: 1px solid #333; position: relative; height: 100vh; }
        
        #theme-btn { position: absolute; left: 10px; top: 12px; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--neon); background: transparent; color: var(--neon); cursor: pointer; z-index: 100; font-size: 18px; box-shadow: 0 0 10px var(--neon); }
        
        header { padding: 15px; text-align: center; border-bottom: 1px solid #333; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px var(--neon); font-size: 18px; background: rgba(0,0,0,0.2); }
        
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 100px; scrollbar-width: none; }
        
        .msg-wrap { display: flex; flex-direction: column; max-width: 85%; position: relative; }
        .user-wrap { align-self: flex-end; }
        .ai-wrap { align-self: flex-start; width: 100%; }
        
        .bubble { padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
        .user-bubble { background: rgba(255,255,255,0.1); border: 1px solid #444; border-bottom-right-radius: 2px; }
        .ai-bubble { background: transparent; border-left: 4px solid var(--neon); padding-left: 15px; }

        .copy-btn { background: transparent; border: 1px solid #444; color: var(--text); font-size: 10px; padding: 4px 8px; border-radius: 5px; cursor: pointer; margin-top: 5px; width: fit-content; opacity: 0.6; }
        .copy-btn:hover { opacity: 1; border-color: var(--neon); color: var(--neon); }

        /* FIXED INPUT AREA - Ye slide nahi hoga */
        #input-area { 
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px; 
            background: var(--card); 
            border-top: 1px solid #333; 
            z-index: 1000;
        }
        
        .input-row { display: flex; gap: 10px; align-items: center; }
        .input-wrap { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid #444; border-radius: 25px; overflow: hidden; }
        input { flex: 1; background: transparent; border: none; color: var(--text); padding: 12px 18px; outline: none; font-size: 16px; width: 100%; }
        
        .btn-send { background: var(--neon); color: #000; border: none; padding: 12px 22px; border-radius: 25px; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px var(--neon); }

        .status { color: var(--neon); font-size: 12px; text-align: center; margin-bottom: 8px; display: none; font-weight: bold; }
    </style>
</head>
<body>

<button id="theme-btn" onclick="toggleTheme()">🎨</button>

<div id="app">
    <header>GEMINI<span style="color:var(--neon)">X</span> PRO</header>
    <div id="chat">
        <div class="msg-wrap ai-wrap">
            <div class="bubble ai-bubble">नमस्ते! 🌟 मैं आपका स्मार्ट AI असिस्टेंट हूँ। पूछिए, मैं आज आपकी क्या मदद कर सकता हूँ? 😊</div>
        </div>
    </div>
    
    <div id="input-area">
        <div id="status" class="status">GeminiX सोच रहा है... 🤔</div>
        <div class="input-row">
            <div class="input-wrap">
                <input type="text" id="prompt" placeholder="यहाँ कुछ पूछें..." autocomplete="off">
            </div>
            <button id="send-btn" class="btn-send" onclick="ask()">SEND</button>
        </div>
    </div>
</div>

<script>
    const KEYS = ["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"]; 
    let chatHistory = [{role: "system", content: "You are a helpful AI. Reply in Hindi. Use lots of relevant emojis based on the mood of the conversation. Use markdown for formatting and tables."}];

    function toggleTheme() { document.body.classList.toggle('light-theme'); }

    function copyText(btn, text) {
        navigator.clipboard.writeText(text);
        btn.innerText = "COPIED! ✅";
        setTimeout(() => { btn.innerText = "COPY 📋"; }, 2000);
    }

    async function ask() {
        const p = document.getElementById('prompt');
        const text = p.value.trim();
        if(!text) return;

        addMsg(text, 'user');
        p.value = "";
        document.getElementById('status').style.display = 'block';
        chatHistory.push({role: "user", content: text});

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${KEYS[0]}`, "Content-Type": "application/json" },
                body: JSON.stringify({ model: "llama-3.1-8b-instant", messages: chatHistory })
            });
            const data = await res.json();
            const reply = data.choices[0].message.content;
            chatHistory.push({role: "assistant", content: reply});
            addMsg(reply, 'ai');
        } catch (e) {
            addMsg("माफ़ कीजिये, कनेक्शन में दिक्कत है। ❌", 'ai');
        } finally {
            document.getElementById('status').style.display = 'none';
        }
    }

    function addMsg(txt, sender) {
        const chat = document.getElementById('chat');
        const wrap = document.createElement('div');
        wrap.className = `msg-wrap ${sender}-wrap`;
        
        const bubble = document.createElement('div');
        bubble.className = `bubble ${sender}-bubble`;
        bubble.innerHTML = marked.parse(txt);
        wrap.appendChild(bubble);

        if(sender === 'ai') {
            const btn = document.createElement('button');
            btn.className = "copy-btn";
            btn.innerText = "COPY 📋";
            btn.onclick = () => copyText(btn, txt);
            wrap.appendChild(btn);
        }

        chat.appendChild(wrap);
        chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById('prompt').addEventListener('keypress', (e) => { if (e.key === 'Enter') ask(); });
</script>
</body>
    </html>
