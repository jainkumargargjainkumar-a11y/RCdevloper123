<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeminiX Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #0b0b0b; --neon: #00ffa3; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); margin: 0; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; }
        
        header { padding: 15px; text-align: center; border-bottom: 1px solid #333; font-weight: bold; color: var(--neon); font-size: 20px; }
        
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        
        .bubble { padding: 12px; border-radius: 10px; max-width: 85%; font-size: 15px; line-height: 1.4; }
        .user-bubble { background: #222; align-self: flex-end; border: 1px solid #444; }
        .ai-bubble { background: transparent; align-self: flex-start; border-left: 3px solid var(--neon); }

        /* Input Area Fix - Isse gayab nahi hoga */
        #input-area { 
            padding: 15px; 
            background: #111; 
            border-top: 1px solid #333; 
            display: flex; 
            gap: 10px;
        }
        
        input { 
            flex: 1; 
            background: #222; 
            border: 1px solid #444; 
            color: #fff; 
            padding: 12px; 
            border-radius: 5px; 
            outline: none; 
        }
        
        button { 
            background: var(--neon); 
            color: #000; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 5px; 
            font-weight: bold; 
            cursor: pointer;
        }

        .status { color: var(--neon); font-size: 12px; text-align: center; margin-bottom: 5px; display: none; }
    </style>
</head>
<body>

<header>GEMINI X PRO</header>

<div id="chat">
    <div class="ai-bubble bubble">नमस्ते! मैं अब वापस आ गया हूँ। पूछिए, क्या मदद करूँ?</div>
</div>

<div id="status" class="status">AI सोच रहा है...</div>

<div id="input-area">
    <input type="text" id="prompt" placeholder="यहाँ लिखें..." autocomplete="off">
    <button onclick="ask()">SEND</button>
</div>

<script>
    const KEYS = ["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"]; 
    let chatHistory = [{role: "system", content: "Reply in Hindi."}];

    async function ask() {
        const p = document.getElementById('prompt');
        if(!p.value.trim()) return;

        const userText = p.value;
        addMsg(userText, 'user');
        p.value = "";
        
        document.getElementById('status').style.display = 'block';

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${KEYS[0]}`, "Content-Type": "application/json" },
                body: JSON.stringify({ model: "llama-3.1-8b-instant", messages: [...chatHistory, {role:"user", content:userText}] })
            });
            const data = await res.json();
            const reply = data.choices[0].message.content;
            addMsg(reply, 'ai');
        } catch (e) {
            addMsg("Error: Connection Failed.", 'ai');
        } finally {
            document.getElementById('status').style.display = 'none';
        }
    }

    function addMsg(txt, sender) {
        const chat = document.getElementById('chat');
        const div = document.createElement('div');
        div.className = sender + '-bubble bubble';
        div.innerHTML = marked.parse(txt);
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }
</script>
</body>
</html>
