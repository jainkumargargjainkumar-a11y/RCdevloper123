<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeminiX Pro AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #050505; --neon: #00ffa3; --card: #0d0d0d; --text: #ffffff; }
        body.light-theme { --bg: #ffffff; --card: #f8f9fa; --text: #1a1a1a; --neon: #2563eb; }
        
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Poori screen ko fix karne ke liye */
        html, body { 
            height: 100%; 
            margin: 0; 
            background: var(--bg); 
            color: var(--text); 
            overflow: hidden; 
        }

        /* Main Container: Ise flex banaya hai taki input niche chipka rahe */
        #app { 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
            max-width: 600px; 
            margin: auto; 
            background: var(--card); 
            position: relative;
        }
        
        header { 
            padding: 15px; 
            text-align: center; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            font-weight: 900; 
            letter-spacing: 2px; 
            text-shadow: 0 0 10px var(--neon); 
            font-size: 18px; 
            flex-shrink: 0;
        }

        /* Chat Area: Ye bachi hui poori jagah lega */
        #chat { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            scrollbar-width: none; 
            -webkit-overflow-scrolling: touch;
        }
        
        .msg-wrap { display: flex; flex-direction: column; max-width: 85%; }
        .user-wrap { align-self: flex-end; }
        .ai-wrap { align-self: flex-start; width: 100%; }
        
        .bubble { padding: 12px 16px; border-radius: 20px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
        .user-bubble { background: var(--neon); color: #000; border-bottom-right-radius: 2px; font-weight: 500; }
        .ai-bubble { background: rgba(255,255,255,0.05); border-left: 4px solid var(--neon); padding-left: 15px; }

        .copy-btn { background: transparent; border: 1px solid #444; color: var(--text); font-size: 10px; padding: 5px 10px; border-radius: 5px; cursor: pointer; margin-top: 5px; width: fit-content; opacity: 0.7; }

        /* THEME BUTTON */
        #theme-btn { position: absolute; left: 10px; top: 12px; width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--neon); background: transparent; color: var(--neon); cursor: pointer; z-index: 100; font-size: 16px; display: flex; align-items: center; justify-content: center; }

        /* INPUT AREA: Ye hamesha bottom par fix rahega */
        #input-area { 
            padding: 15px; 
            background: var(--card); 
            border-top: 1px solid rgba(255,255,255,0.1); 
            flex-shrink: 0;
        }
        
        .input-row { display: flex; gap: 10px; align-items: center; }
        .input-wrap { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid #333; border-radius: 30px; padding: 2px 15px; }
        input { width: 100%; background: transparent; border: none; color: var(--text); padding: 12px 0; outline: none; font-size: 16px; }
        
        .btn-send { 
            background: var(--neon); 
            color: #000; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 30px; 
            font-weight: bold; 
            cursor: pointer; 
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0, 255, 163, 0.3);
        }

        .status { color: var(--neon); font-size: 12px; text-align: center; margin-bottom: 8px; display: none; font-weight: bold; }
    </style>
</head>
<body>

<button id="theme-btn" onclick="toggleTheme()">🎨</button>

<div id="app">
    <header>GEMINI<span style="color:var(--neon)">X</span> PRO</header>
    
    <div id="chat">
        <div class="msg-wrap ai-wrap">
            <div class="bubble ai-bubble">नमस्ते! 🌟 आपका AI अब पूरी तरह से सेट है। बैकग्राउंड बदलें या कुछ भी पूछें! 😊</div>
        </div>
    </div>
    
    <div id="input-area">
        <div id="status" class="status">GeminiX सोच रहा है... 🤔</div>
        <div class="input-row">
            <div class="input-wrap">
                <input type="text" id="prompt" placeholder="यहाँ संदेश लिखें..." autocomplete="off">
            </div>
            <button id="send-btn" class="btn-send" onclick="ask()">SEND</button>
        </div>
    </div>
</div>

<script>
    function toggleTheme() {
        document.body.classList.toggle('light-theme');
    }

    const KEYS = ["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"]; 
    let chatHistory = [{role: "system", content: "You are a helpful assistant. Reply in Hindi with expressions and emojis. Use markdown for tables."}];

    function copyText(btn, text) {
        navigator.clipboard.writeText(text);
        btn.innerText = "✅ COPIED";
        setTimeout(() => { btn.innerText = "📋 COPY"; }, 2000);
    }

    async function ask() {
        const p = document.getElementById('prompt');
        const text = p.value.trim();
        if(!text) return;

        addMsg(text, 'user');
        p.value = "";
        document.getElementById('status').style.display = 'block';
        chatHistory.push({role: "user", content: text});

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${KEYS[0]}`, "Content-Type": "application/json" },
                body: JSON.stringify({ model: "llama-3.1-8b-instant", messages: chatHistory })
            });
            const data = await res.json();
            const reply = data.choices[0].message.content;
            chatHistory.push({role: "assistant", content: reply});
            addMsg(reply, 'ai');
        } catch (e) {
            addMsg("माफ़ करें, नेटवर्क की समस्या है। ❌", 'ai');
        } finally {
            document.getElementById('status').style.display = 'none';
        }
    }

    function addMsg(txt, sender) {
        const chat = document.getElementById('chat');
        const wrap = document.createElement('div');
        wrap.className = `msg-wrap ${sender}-wrap`;
        const bubble = document.createElement('div');
        bubble.className = `bubble ${sender}-bubble`;
        bubble.innerHTML = marked.parse(txt);
        wrap.appendChild(bubble);

        if(sender === 'ai') {
            const btn = document.createElement('button');
            btn.className = "copy-btn";
            btn.innerText = "📋 COPY";
            btn.onclick = () => copyText(btn, txt);
            wrap.appendChild(btn);
        }
        chat.appendChild(wrap);
        chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById('prompt').addEventListener('keypress', (e) => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
