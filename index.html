function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.lineTo(x+w-r,y);X.quadraticCurveTo(x+w,y,x+w,y+r);X.lineTo(x+w,y+h-r);X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);X.lineTo(x+r,y+h);X.quadraticCurveTo(x,y+h,x,y+h-r);X.lineTo(x,y+r);X.quadraticCurveTo(x,y,x+r,y);X.closePath();X.fill();}
function rs(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.lineTo(x+w-r,y);X.quadraticCurveTo(x+w,y,x+w,y+r);X.lineTo(x+w,y+h-r);X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);X.lineTo(x+r,y+h);X.quadraticCurveTo(x,y+h,x,y+h-r);X.lineTo(x,y+r);X.quadraticCurveTo(x,y,x+r,y);X.closePath();X.stroke();}

});

// Store clicks
function storeClick(mx,my){
  sClick();
  if(mx>W-45&&mx<W-10&&my>50&&my<80){SO=false;return;}
  if(mx>W/2+20&&mx<W/2+130&&my>H-50&&my<H-16){SO=false;return;}
  let tw=(W-20)/3;
  if(my>82&&my<112){if(mx<10+tw)ST=0;else if(mx<10+tw*2)ST=1;else ST=2;SS=0;sVel=0;return;}
  if(iD)return;
  if(ST===0)birdClick(mx,my);else if(ST===1)mapClick(mx,my);else giftClick(mx,my);
}
function startAdSpinner(birdId){if(adSpinner.on)return;adSpinner={on:true,birdId:birdId,t:0,dur:140+Math.floor(Math.random()*40)};sClick();note('📺 Watching Ad...','#42A5F5');}
function birdClick(mx,my){
  if(adSpinner.on)return;
  let cols=3,cw=118,ch=172,px=10,gap=10;
  let sections=getBirdSections(ch,gap,120);
  let found=false;
  sections.forEach(sec=>{
    if(found)return;
    sec.items.forEach((b,i)=>{
      if(found)return;
      let col=i%cols,row=Math.floor(i/cols);
      let cy=sec.startY+row*(ch+gap)-SS,cx=px+col*(cw+gap);
      if(cy+ch<115||cy>H-60)return;
      // Check if click is inside this card at all
      if(mx<cx||mx>cx+cw||my<cy||my>cy+ch)return;
      let ay=cy+ch-28;
      let isAd=adBirds.includes(b.id);
      // --- AD BIRDS ---
      if(isAd&&!b.on){
        if(adProg[b.id]>=3){b.on=1;EB=b.id;sUnlock();note('✨ '+b.n+' Equipped!','#4CAF50');save();found=true;return;}
        else{startAdSpinner(b.id);found=true;return;}
      }
      // --- ALREADY UNLOCKED: EQUIP ---
      if(b.on){EB=b.id;sUnlock();note('🐦 '+b.n+' Equipped!','#7C4DFF');save();found=true;return;}
      // --- PREMIUM / DINO (real money mock) ---
      if(b.pm||b.dino){note('💵 Purchase $'+b.pr.toFixed(2)+' (mock)','#FFD740');found=true;return;}
      // --- VIP (coins) ---
      if(b.vp&&b.cost>0){
        let vCost=parseInt(b.cost)||0,vCoins=parseInt(coins)||0;
        if(vCoins>=vCost){coins=vCoins-vCost;b.on=1;EB=b.id;sUnlock();note('✨ VIP '+b.n+' Unlocked!','#FFD740');save();}
        else{note('❌ Need '+vCost+' coins (have '+vCoins+')','#FF5252');}
        found=true;return;
      }
      // --- KEY-COST BIRDS ---
      if(b.keyCost>0){
        let bKey=parseInt(b.keyCost)||0,pKeys=parseInt(keys)||0;
        if(pKeys>=bKey){keys=pKeys-bKey;b.on=1;EB=b.id;sUnlock();note('✨ '+b.n+' Unlocked!','#4CAF50');save();}
        else{note('❌ Need '+bKey+' keys (have '+pKeys+')','#FF5252');}
        found=true;return;
      }
      // --- COIN-COST BIRDS ---

    else if(sec.type==='vip'){let hy=sec.headerY-SS;if(hy<cB&&hy+36>cT){X.fillStyle='rgba(255,215,0,0.06)';X.fillRect(0,hy,W-18,36);X.font='bold 12px "Segoe UI"';X.fillStyle='#FFD740';X.textAlign='center';X.shadowColor='#FFD740';X.shadowBlur=8;X.fillText('👑 VIP EXCLUSIVE 👑',W/2-9,hy+22);X.shadowBlur=0;}}
    for(let i=0;i<sec.items.length;i++){
      let row=i/cols|0,cy=sec.startY+row*(ch+gap)-SS;
      if(cy>cB+5)break;if(cy+ch<cT-5)continue;
      drawBirdCard(sec.items[i],px+(i%cols)*(cw+gap),cy,cw,ch,t);
    }
  });
}

function drawBirdCard(b,cx,cy,cw,ch,t){
  let eq=EB===b.id,ul=b.on,pm=b.pm,vp=b.vp,dn=b.dino;
  if(pm||dn||vp){let gp=0.4+Math.sin(t*0.004+b.id)*0.35;X.shadowColor=dn?'#FF6D00':vp?'#FFD740':'#FFD740';X.shadowBlur=16*gp;X.strokeStyle=dn?'rgba(255,109,0,'+gp*0.8+')':vp?'rgba(255,215,0,'+gp*0.8+')':'rgba(255,215,0,'+gp*0.8+')';X.lineWidth=2.5;rs(cx-1,cy-1,cw+2,ch+2,9);X.shadowBlur=0;}
  X.fillStyle=eq?'rgba(124,77,255,0.25)':dn?'rgba(60,25,0,0.85)':vp?'rgba(60,50,10,0.8)':ul?'rgba(35,35,65,0.75)':'rgba(28,28,48,0.85)';rr(cx,cy,cw,ch,8);
  if(!pm&&!vp&&!dn){X.strokeStyle=eq?'rgba(124,77,255,0.5)':'rgba(255,255,255,0.06)';X.lineWidth=1;rs(cx,cy,cw,ch,8);}
  let topH=0;
  if(dn){topH=13;X.fillStyle='#FF6D00';rr(cx,cy,cw,13,0);X.font='bold 7px "Segoe UI"';X.textAlign='center';X.fillStyle='#FFF';X.fillText('🦖 DINO 5x',cx+cw/2,cy+10);}
  else if(pm){topH=13;X.fillStyle='#FFD740';rr(cx,cy,cw,13,0);X.font='bold 7px "Segoe UI"';X.textAlign='center';X.fillStyle='#1a1a2e';X.fillText('⭐ PREMIUM',cx+cw/2,cy+10);}
  else if(vp){topH=13;X.fillStyle='#FF6F00';rr(cx,cy,cw,13,0);X.font='bold 7px "Segoe UI"';X.textAlign='center';X.fillStyle='#FFF';X.fillText('👑 VIP',cx+cw/2,cy+10);}
  X.font='bold 7px "Segoe UI"';X.fillStyle=RC[b.r]||'#999';X.textAlign='center';X.fillText(b.r.toUpperCase(),cx+cw/2,cy+topH+10);
  let bY=cy+topH+30,bobY=Math.sin(t*0.004+b.id*0.7)*3,wingA=Math.sin(t*0.005+b.id)*12;
  drawBirdAt(cx+cw/2,bY+bobY,0,wingA,b,0.7);
  let canAfford=false;
  if(!ul){
    if(b.keyCost>0)canAfford=(parseInt(keys)||0)>=(parseInt(b.keyCost)||0);
    else if(b.cost>0)canAfford=(parseInt(coins)||0)>=(parseInt(b.cost)||0);
  }
  if(!ul&&!canAfford&&!adBirds.includes(b.id)){X.fillStyle='rgba(0,0,0,0.6)';X.beginPath();X.arc(cx+cw-11,cy+topH+9,7,0,6.28);X.fill();X.font='9px "Segoe UI"';X.textAlign='center';X.fillText('🔒',cx+cw-11,cy+topH+13);
    if(!adBirds.includes(b.id)&&(b.cost>=5000||b.pm||b.vp||b.dino)){X.fillStyle=dn?'rgba(120,40,0,0.65)':'rgba(80,20,20,0.6)';rr(cx+10,bY+8,cw-20,13,3);X.font='bold 6px "Segoe UI"';X.textAlign='center';X.fillStyle=dn?'#FF9800':'#FF5252';X.fillText(dn?'🦖 REAL MONEY':'🔥 GRIND MORE',cx+cw/2,bY+17);}
    if(adBirds.includes(b.id)&&(adProg[b.id]||0)<3){X.fillStyle='rgba(21,101,192,0.6)';rr(cx+10,bY+8,cw-20,13,3);X.font='bold 6px "Segoe UI"';X.textAlign='center';X.fillStyle='#90CAF9';X.fillText('📺 FREE WITH ADS',cx+cw/2,bY+17);}
  }
  let ny=bY+20;
  X.font='bold 8px "Segoe UI"';X.fillStyle=ul?'#FFF':'rgba(255,255,255,0.7)';X.textAlign='center';X.fillText(b.n,cx+cw/2,ny);
  X.font='7px "Segoe UI"';X.fillStyle='rgba(255,255,255,0.4)';X.fillText(b.ab!=='None'?'⚡'+b.ab+(b.abMul>1?' ('+b.abMul+'x)':''):'--',cx+cw/2,ny+10);
  X.font='6px "Segoe UI"';X.fillStyle='rgba(255,255,255,0.25)';X.fillText(b.ds,cx+cw/2,ny+19);
  if(b.keyCost>0){X.font='bold 7px "Segoe UI"';X.fillStyle='rgba(255,183,77,0.6)';X.fillText('🔑 '+b.keyCost+' Keys Required',cx+cw/2,ny+27);}
  else if(b.mc&&!b.pm&&!b.dino){X.fillStyle='rgba(255,215,0,0.35)';X.font='6px "Segoe UI"';X.fillText('💰 '+b.mc,cx+cw/2,ny+27);}
  let ay=cy+ch-28;
  if(pm||dn){
    let gp2=0.6+Math.sin(t*0.004)*0.3;X.fillStyle='rgba(255,215,0,0.1)';rr(cx+6,ay,cw-12,22,6);
    X.strokeStyle=dn?'rgba(255,109,0,'+gp2+')':'rgba(255,215,0,'+gp2+')';X.lineWidth=1.5;rs(cx+6,ay,cw-12,22,6);
    X.font='bold 10px "Segoe UI"';X.textAlign='center';X.shadowColor=dn?'#FF6D00':'#FFD740';X.shadowBlur=6;X.fillStyle=dn?'#FF9800':'#FFD740';X.fillText('$'+b.pr.toFixed(2),cx+cw/2,ay+15);X.shadowBlur=0;
  } else if(!ul&&adBirds.includes(b.id)){
    let prog=adProg[b.id]||0,done=prog>=3;
    if(done){X.fillStyle='rgba(76,175,80,0.85)';rr(cx+6,ay,cw-12,22,6);X.strokeStyle='#69F0AE';X.lineWidth=1.5;rs(cx+6,ay,cw-12,22,6);X.font='bold 8px "Segoe UI"';X.textAlign='center';X.fillStyle='#FFF';X.fillText('✅ EQUIP NOW',cx+cw/2,ay+15);}
    else{
      let isSpinning=adSpinner.on&&adSpinner.birdId===b.id;
      let pulse=0.7+Math.sin(t*0.005)*0.2;
      X.fillStyle='rgba(30,136,229,'+pulse+')';rr(cx+6,ay,cw-12,22,6);X.strokeStyle='rgba(100,181,246,0.6)';X.lineWidth=1.5;rs(cx+6,ay,cw-12,22,6);
      if(isSpinning){X.save();X.translate(cx+cw/2,ay+11);let sa=t*0.012;X.strokeStyle='#FFF';X.lineWidth=2;X.beginPath();X.arc(0,0,7,sa,sa+4,false);X.stroke();X.restore();}
      else{X.font='bold 7px "Segoe UI"';X.textAlign='center';X.fillStyle='#FFF';X.fillText('📺 WATCH AD',cx+cw/2,ay+10);}
      X.fillStyle='rgba(0,0,0,0.5)';rr(cx+cw/2-16,ay-12,32,11,4);X.font='bold 7px "Segoe UI"';X.textAlign='center';X.fillStyle=prog>0?'#64B5F6':'rgba(255,255,255,0.5)';X.fillText('('+prog+'/3)',cx+cw/2,ay-4);
      for(let d=0;d<3;d++){X.fillStyle=d<prog?'#64B5F6':'rgba(255,255,255,0.12)';X.beginPath();X.arc(cx+cw/2-10+d*10,ay+16,2.5,0,6.28);X.fill();}
    }
  } else if(ul){
    if(eq){X.fillStyle='rgba(124,77,255,0.6)';rr(cx+6,ay,cw-12,22,6);X.font='bold 8px "Segoe UI"';X.textAlign='center';X.fillStyle='#FFF';X.fillText('✅ EQUIPPED',cx+cw/2,ay+15);}
    else{X.fillStyle='rgba(67,160,71,0.5)';rr(cx+6,ay,cw-12,22,6);X.font='bold 8px "Segoe UI"';X.textAlign='center';X.fillStyle='#FFF';X.fillText('EQUIP',cx+cw/2,ay+15);}
  } else {
    let canBuy=false;
    if(b.keyCost>0)canBuy=(parseInt(keys)||0)>=(parseInt(b.keyCost)||0);
    else if(b.cost>0)canBuy=(parseInt(coins)||0)>=(parseInt(b.cost)||0);
    if(b.keyCost>0){
      if(canBuy){
        let gPulse=0.7+Math.sin(t*0.005)*0.3;
        X.fillStyle='rgba(255,215,0,'+gPulse+')';rr(cx+6,ay,cw-12,22,6);
        X.shadowColor='#FFD700';X.shadowBlur=15;X.strokeStyle='rgba(255,215,0,0.8)';X.lineWidth=2;rs(cx+6,ay,cw-12,22,6);X.shadowBlur=0;
      } else {
        X.fillStyle='rgba(70,60,50,0.6)';rr(cx+6,ay,cw-12,22,6);
        X.font='7px "Segoe UI"';X.fillStyle='rgba(255,255,255,0.25)';X.textAlign='right';X.fillText('🔒',cx+cw-12,ay+15);
      }
      X.textAlign='center';X.font='16px "Segoe UI"';X.fillStyle=canBuy?'#5D3800':'rgba(255,200,80,0.35)';X.fillText('🔑',cx+cw/2-22,ay+17);
      X.font='bold 10px "Segoe UI"';X.fillStyle=canBuy?'#3E2200':'rgba(255,255,255,0.35)';X.fillText(b.keyCost,cx+cw/2+4,ay+15);
    } else {
      if(canBuy){
        let gPulse=0.7+Math.sin(t*0.005)*0.3;
        X.fillStyle='rgba(255,215,0,'+gPulse+')';rr(cx+6,ay,cw-12,22,6);
        X.shadowColor='#FFD700';X.shadowBlur=15;X.strokeStyle='rgba(255,215,0,0.8)';X.lineWidth=2;rs(cx+6,ay,cw-12,22,6);X.shadowBlur=0;
      } else {
        X.fillStyle='rgba(70,60,50,0.6)';rr(cx+6,ay,cw-12,22,6);
        X.font='7px "Segoe UI"';X.fillStyle='rgba(255,255,255,0.25)';X.textAlign='right';X.fillText('🔒',cx+cw-12,ay+15);
      }
      X.textAlign='center';X.font='16px "Segoe UI"';X.fillStyle=canBuy?'#5D3800':'rgba(255,200,80,0.35)';X.fillText('💰',cx+cw/2-26,ay+17);
      X.font='bold 10px "Segoe UI"';X.fillStyle=canBuy?'#3E2200':'rgba(255,255,255,0.35)';X.fillText(b.cost,cx+cw/2+4,ay+15);
    }
  }
}

function drawMapsTab(cT,cB,t){
  SM=Math.max(0,120+MP.length*82+30-(cB-cT));
  MP.forEach((m,i)=>{
    let cy=120+i*82-SS;if(cy+72<cT||cy>cB)return;
    let ul=m.on;
    X.fillStyle=ul?'rgba(35,35,65,0.8)':'rgba(20,20,40,0.6)';rr(15,cy,W-48,72,10);
    if(cL===m.li){X.strokeStyle='#7C4DFF';X.lineWidth=2;rs(15,cy,W-48,72,10);}
    X.font='bold 11px "Segoe UI"';X.fillStyle=ul?'#FFF':'rgba(255,255,255,0.4)';X.textAlign='left';X.fillText(m.n,25,cy+20);
    X.font='9px "Segoe UI"';X.fillStyle='rgba(255,255,255,0.35)';X.fillText('Coins: '+m.coin+' | CR: '+m.cr+'/pipe',25,cy+36);
    X.fillText(ul?'🔓 Unlocked':'🔒 Need '+m.pts+' pts',25,cy+52);
    if(!ul){X.fillStyle='rgba(0,0,0,0.4)';X.fillRect(15,cy,W-48,72);X.fillStyle='rgba(255,255,255,0.3)';rr(15,cy,W-48,72,10);}
    if(cL===m.li){X.font='bold 9px "Segoe UI"';X.fillStyle='#7C4DFF';X.textAlign='right';X.fillText('▶ ACTIVE',W-45,cy+20);}
  });
}

function drawGiftsTab(cT,cB,t){
  SM=Math.max(0,140+GF.length*110+80-(cB-cT));
  GF.forEach((g,i)=>{
    let cy=140+i*110-SS;if(cy+100<cT||cy>cB)return;
    X.fillStyle='rgba(30,30,55,0.8)';rr(15,cy,W-48,95,10);
    X.font='28px "Segoe UI"';X.textAlign='center';X.fillText(g.e,50,cy+38);
    X.font='bold 11px "Segoe UI"';X.fillStyle='#FFF';X.textAlign='left';X.fillText(g.n,80,cy+22);
    X.font='9px "Segoe UI"';X.fillStyle='rgba(255,255,255,0.4)';X.fillText('Reward: '+g.rw,80,cy+38);
    let pW=W-120,pX=80,pY=cy+50;
    X.fillStyle='rgba(255,255,255,0.08)';rr(pX,pY,pW,8,4);
    let ratio=Math.min(1,g.p/g.mx);
    if(ratio>0){X.fillStyle=ratio>=1?'#4CAF50':'#7C4DFF';rr(pX,pY,pW*ratio,8,4);}
    X.font='bold 8px "Segoe UI"';X.fillStyle='rgba(255,255,255,0.5)';X.textAlign='right';X.fillText(g.p+'/'+g.mx,pX+pW,pY-3);
    let bx=W/2-65,by=cy+68,bw=130,bh=24;
    if(g.sp){
      let canS=keys>=5;
      X.fillStyle=canS?'rgba(255,215,0,0.7)':'rgba(50,50,60,0.5)';rr(bx,by,bw,bh,6);
      X.font='bold 9px "Segoe UI"';X.textAlign='center';X.fillStyle=canS?'#FFF':'rgba(255,255,255,0.3)';
      X.fillText(canS?'🔑 OPEN (5 Keys)':'🔒 Need 5 Keys',bx+bw/2,by+16);
    } else {
      let rdy=g.p>=g.mx;
      X.fillStyle=rdy?'rgba(76,175,80,0.7)':'rgba(50,50,60,0.4)';rr(bx,by,bw,bh,6);
      X.font='bold 9px "Segoe UI"';X.textAlign='center';X.fillStyle=rdy?'#FFF':'rgba(255,255,255,0.3)';
      X.fillText(rdy?'✨ CLAIM':'🔒 In Progress',bx+bw/2,by+16);
    }
  });
}

// Update loop
function update(){
  let t=Date.now();
  // Ad spinner
  if(adSpinner.on){adSpinner.t++;if(adSpinner.t>=adSpinner.dur){adSpinner.on=false;let bid=adSpinner.birdId;adProg[bid]=(adProg[bid]||0)+1;sChime();note('📺 Ad Complete! ('+adProg[bid]+'/3)','#42A5F5');if(adProg[bid]>=3){BD[bid].on=1;EB=bid;sUnlock();note('✨ '+BD[bid].n+' UNLOCKED!','#4CAF50');}save();}}
  // Notifications
  if(ntf.on){ntf.t--;if(ntf.t<=0)ntf.on=0;}
  if(canim.on){canim.t--;if(canim.t<=0)canim.on=0;}
  if(lT.on){lT.t--;if(lT.t<=0)lT.on=0;}
  if(hC.on){hC.t--;if(hC.t<=0)hC.on=0;}
  // Floats
  floats.forEach(f=>{f.y+=f.vy;f.vy*=0.97;f.al-=1/f.ml;f.sc=Math.min(1,f.sc+0.08);f.life--;});
  floats=floats.filter(f=>f.life>0&&f.al>0);
  // Shards
  shards.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=0.15;s.rot+=s.rs;s.al-=0.015;s.life--;});
  shards=shards.filter(s=>s.life>0&&s.al>0);
  // Trails
  trails.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.al-=0.035;p.sz*=0.96;p.life--;});
  trails=trails.filter(p=>p.life>0&&p.al>0);
  // Shake
  if(shk.i>0){shk.x=(Math.random()-0.5)*shk.i;shk.y=(Math.random()-0.5)*shk.i;shk.i*=0.88;}else{shk.x=0;shk.y=0;}
  // Death anim
  if(dP==='shattering'){dT--;if(dT<=0){dP='';GS='over';}}

  if(SO){drawStore();return;}
  if(GS==='menu'){drawMenu();return;}

  // Game physics
  if(GS==='playing'){
    bird.vy+=G;bird.y+=bird.vy;if(bird.fl>0)bird.fl-=0.3;
    fr++;
    // Spawn pipes
    if(fr===1||pipes.length===0||pipes[pipes.length-1].x<=W-PI2){
      let minGY=70,maxGY=H-GH-PGAP-70,gY=minGY+Math.random()*(maxGY-minGY);
      let np={x:W+10,gapY:gY,scored:false,hasKey:false};
      if(pendingKeySpawn){np.hasKey=true;spawnMapKey(np);pendingKeySpawn=false;}
      pipes.push(np);
    }
    // Move pipes
    pipes.forEach(p=>{p.x-=PS;});
    // Move map keys with pipes
    mapKeys.forEach(k=>{if(!k.collected)k.x-=PS;});
    // Score
    pipes.forEach(p=>{if(!p.scored&&p.x+PW<bird.x){p.scored=true;score++;onScore();}});
    // Key collection
    mapKeys.forEach(k=>{if(!k.collected){let dx=bird.x-k.x,dy=bird.y-k.y;if(Math.sqrt(dx*dx+dy*dy)<22){k.collected=true;keys++;totalKeys++;spFloat(k.x,k.y-20,'🔑 +1',true);note('🔑 Golden Key Found!','#FF9800');sChime();save();}}});
    // Collision
    let dead=false;
    if(bird.y+BR>H-GH||bird.y-BR<0)dead=true;
    pipes.forEach(p=>{if(bird.x+BR-4>p.x&&bird.x-BR+4<p.x+PW){if(bird.y-BR+4<p.gapY||bird.y+BR-4>p.gapY+PGAP)dead=true;}});
    if(dead){GS='dying';onDeath();}
    // Clouds
    clouds.forEach(c=>{c.x-=c.s;if(c.x+c.w<0){c.x=W+c.w;c.y=30+Math.random()*180;}});
    // Clean
    pipes=pipes.filter(p=>p.x+PW>-10);
    mapKeys=mapKeys.filter(k=>k.x>-30);
    gOff=(gOff+PS)%40;
  }

  // Draw
  X.save();X.translate(shk.x,shk.y);
  drawSky();drawClouds();
  pipes.forEach(p=>drawPipe(p));
  mapKeys.forEach(k=>drawMapKeyInGame(k,t));
  drawTrails();drawBird2();drawShards();drawGround();
  // Ground scroll lines
  X.fillStyle='rgba(255,255,255,0.06)';for(let i=-1;i<12;i++){let lx=i*40-gOff;X.fillRect(lx,H-GH+6,24,3);}
  drawFloats();drawHUD();drawLvlTrans();drawHeroCeleb();
  X.restore();

  if(GS==='over')drawGameOver();
  if(GS==='ready'){X.save();X.textAlign='center';X.font='bold 18px "Segoe UI"';X.fillStyle='rgba(255,255,255,0.6)';X.fillText('TAP TO FLY!',W/2,H/2+60);X.restore();}
}

// Main loop
load();init();
function loop(){update();requestAnimationFrame(loop);}
loop();
</script>
