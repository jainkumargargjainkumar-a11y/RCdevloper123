meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeminiX Pro AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #050505; --neon: #00ffa3; --card: #0d0d0d; --text: #ffffff; --user-bg: #00ffa3; }
        body.light-theme { --bg: #ffffff; --card: #f8f9fa; --text: #1a1a1a; --neon: #2563eb; --user-bg: #2563eb; }
        
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        html, body { height: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--text); overflow: hidden; position: fixed; width: 100%; }
        
        #app { display: flex; flex-direction: column; height: 100dvh; width: 100%; max-width: 600px; margin: auto; background: var(--card); position: relative; }
        
        header { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
        .brand { font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px var(--neon); font-size: 18px; }
        .icon-btn { background: transparent; border: 1px solid var(--neon); color: var(--neon); border-radius: 50%; width: 38px; height: 38px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }

        #sidebar {
            position: absolute; left: -260px; top: 0; width: 260px; height: 100%;
            background: #111; border-right: 1px solid #333; z-index: 200;
            transition: 0.3s; padding: 20px; display: flex; flex-direction: column;
        }
        #sidebar.active { left: 0; }
        .history-item { padding: 12px; background: rgba(255,255,255,0.05); border-radius: 8px; font-size: 12px; cursor: pointer; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #bbb; }

        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; scrollbar-width: none; }
        #chat::-webkit-scrollbar { display: none; }
        
        .msg-wrap { display: flex; flex-direction: column; width: 100%; }
        .user-wrap { align-items: flex-end; }
        .ai-wrap { align-items: flex-start; }
        
        .bubble { padding: 10px 16px; border-radius: 20px; font-size: 15px; line-height: 1.4; max-width: 85%; width: fit-content; }
        .user-bubble { background: var(--user-bg); color: #000; border-bottom-right-radius: 4px; font-weight: 500; }
        .ai-bubble { background: transparent; border-left: 3px solid var(--neon); padding-left: 12px; color: var(--text); }

        /* LOADING ANIMATION */
        #loader { display: none; align-items: center; gap: 8px; padding: 10px 20px; }
        .dot { width: 8px; height: 8px; background: var(--neon); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

        .action-btns { display: flex; gap: 8px; margin-top: 8px; margin-left: 12px; }
        .small-btn { background: rgba(255,255,255,0.05); border: 1px solid #444; color: var(--text); font-size: 10px; padding: 5px 10px; border-radius: 6px; cursor: pointer; }

        #input-area { padding: 10px; background: var(--card); border-top: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
        .input-row { display: flex; gap: 8px; align-items: flex-end; }
        .input-wrap { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid #333; border-radius: 20px; padding: 2px 12px; }
        textarea { width: 100%; background: transparent; border: none; color: var(--text); padding: 10px 0; outline: none; font-size: 16px; resize: none; height: 40px; }
        .btn-send { background: var(--neon); color: #000; border: none; padding: 10px 22px; border-radius: 25px; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body class="dark-theme">

<div id="app">
    <div id="sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
            <h3 style="color:var(--neon); margin:0;">इतिहास / History</h3>
            <span onclick="toggleMenu()" style="cursor:pointer; color:var(--neon); font-size:22px;">✕</span>
        </div>
        <div id="history-list" style="overflow-y:auto; flex:1;"></div>
        <button class="small-btn" onclick="clearHistory()" style="margin-top:10px;">Clear Data</button>
    </div>

    <header>
        <button class="icon-btn" onclick="toggleMenu()" style="border:none;">☰</button>
        <div class="brand">GEMINI<span style="color:var(--neon)">X</span> PRO</div>
        <button class="icon-btn" onclick="toggleTheme()">🎨</button>
    </header>
    
    <div id="chat"></div>

    <div id="loader">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>

    <div id="input-area">
        <div class="input-row">
            <div class="input-wrap">
                <textarea id="prompt" placeholder="Ask in Hindi or English..." rows="1" oninput="autoGrow(this)"></textarea>
            </div>
            <button class="btn-send" onclick="ask()">SEND</button>
        </div>
    </div>
</div>

<script>
    function toggleTheme() { document.body.classList.toggle('light-theme'); }
    function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }
    function autoGrow(element) { element.style.height = "5px"; element.style.height = (element.scrollHeight) + "px"; }

    const API_KEY = "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"; 
    let chatHistory = JSON.parse(localStorage.getItem('gemini_chat')) || [
        {role: "system", content: "You are a bilingual AI. If the user speaks Hindi, reply ONLY in pure Hindi. If the user speaks English, reply ONLY in English. STRICTLY NO HINGLISH. Maintain the language of the prompt."}
    ];

    window.onload = () => { renderChat(); updateSidebar(); };

    function renderChat() {
        const chatBox = document.getElementById('chat');
        chatBox.innerHTML = "";
        chatHistory.forEach((msg, index) => {
            if(msg.role !== 'system') addMsgUI(msg.content, msg.role === 'user' ? 'user' : 'ai', index);
        });
    }

    async function ask() {
        const p = document.getElementById('prompt');
        const text = p.value.trim();
        if(!text) return;
        
        p.value = ""; p.style.height = "40px";
        document.getElementById('loader').style.display = 'flex';

        chatHistory.push({role: "user", content: text});
        renderChat();
        save();

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    model: "llama-3.1-8b-instant", 
                    messages: chatHistory,
                    temperature: 0.4
                })
            });
            const data = await res.json();
            const reply = data.choices[0].message.content;
            chatHistory.push({role: "assistant", content: reply});
            renderChat();
            save();
        } catch (e) { console.error(e); }
        finally { document.getElementById('loader').style.display = 'none'; }
    }

    function addMsgUI(txt, sender, id) {
        const chat = document.getElementById('chat');
        const wrap = document.createElement('div');
        wrap.className = `msg-wrap ${sender}-wrap`;
        wrap.id = "msg-" + id;
        const bubble = document.createElement('div');
        bubble.className = `bubble ${sender}-bubble`;
        bubble.innerHTML = marked.parse(txt);
        wrap.appendChild(bubble);

        if(sender === 'ai') {
            const btns = document.createElement('div');
            btns.className = "action-btns";
            btns.innerHTML = `<button class="small-btn" onclick="copyTxt(this, \`${txt.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)">📋 Copy</button>`;
            wrap.appendChild(btns);
        }
        chat.appendChild(wrap);
        wrap.scrollIntoView({ behavior: 'smooth' });
    }

    function goToMsg(id) {
        const el = document.getElementById("msg-" + id);
        if(el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.style.borderLeft = "4px solid var(--neon)";
            setTimeout(() => el.style.borderLeft = "none", 2500);
            toggleMenu();
        }
    }

    function copyTxt(btn, t) {
        navigator.clipboard.writeText(t);
        btn.innerText = "✅ Done";
        setTimeout(() => btn.innerText = "📋 Copy", 2000);
    }

    function save() {
        localStorage.setItem('gemini_chat', JSON.stringify(chatHistory));
        updateSidebar();
    }

    function updateSidebar() {
        const list = document.getElementById('history-list');
        list.innerHTML = "";
        chatHistory.forEach((m, i) => {
            if(m.role === 'user') {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerText = m.content;
                item.onclick = () => goToMsg(i);
                list.appendChild(item);
            }
        });
    }

    function clearHistory() { localStorage.removeItem('gemini_chat'); location.reload(); }
</script>
</body>
</html>
