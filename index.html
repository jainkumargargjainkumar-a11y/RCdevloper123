<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeminiX Pro AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #050505; --neon: #00ffa3; --card: #0d0d0d; --text: #ffffff; }
        body.light-theme { --bg: #ffffff; --card: #f0f0f0; --text: #111111; --neon: #2563eb; }
        
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: 0.2s; }
        
        /* Mobile Screen Fix */
        html, body { height: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--text); overflow: hidden; position: fixed; width: 100%; }
        
        #app { display: flex; flex-direction: column; height: 100vh; width: 100%; max-width: 600px; margin: auto; background: var(--card); position: relative; }
        
        header { padding: 12px; text-align: center; border-bottom: 1px solid #333; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 8px var(--neon); font-size: 18px; flex-shrink: 0; }
        
        /* Chat area scrolls but leaves room for fixed input */
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 80px; -webkit-overflow-scrolling: touch; }
        
        .msg-wrap { display: flex; flex-direction: column; max-width: 85%; position: relative; }
        .user-wrap { align-self: flex-end; }
        .ai-wrap { align-self: flex-start; width: 100%; }
        
        .bubble { padding: 12px 15px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .user-bubble { background: var(--neon); color: #000; border-bottom-right-radius: 2px; font-weight: 500; }
        .ai-bubble { background: transparent; border-left: 4px solid var(--neon); padding-left: 12px; }

        .copy-btn { background: transparent; border: 1px solid #444; color: var(--text); font-size: 10px; padding: 4px 8px; border-radius: 5px; cursor: pointer; margin-top: 5px; width: fit-content; }

        /* THEME BUTTON FIXED */
        #theme-btn { position: absolute; left: 10px; top: 10px; width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--neon); background: var(--card); color: var(--neon); cursor: pointer; z-index: 2000; font-size: 16px; display: flex; align-items: center; justify-content: center; }

        /* INPUT AREA - Always on top of keyboard */
        #input-area { 
            position: absolute; bottom: 0; width: 100%; 
            padding: 10px; background: var(--card); 
            border-top: 1px solid #333; z-index: 1000;
        }
        
        .input-row { display: flex; gap: 8px; align-items: center; }
        .input-wrap { flex: 1; background: rgba(128,128,128,0.1); border: 1px solid #444; border-radius: 25px; padding: 2px 12px; }
        input { width: 100%; background: transparent; border: none; color: var(--text); padding: 10px 5px; outline: none; font-size: 16px; }
        
        .btn-send { background: var(--neon); color: #000; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; flex-shrink: 0; box-shadow: 0 0 10px var(--neon); }

        .status { color: var(--neon); font-size: 11px; text-align: center; margin-bottom: 5px; display: none; }
    </style>
</head>
<body id="main-body">

<button id="theme-btn" onclick="toggleTheme()">🎨</button>

<div id="app">
    <header>GEMINI<span style="color:var(--neon)">X</span> PRO</header>
    
    <div id="chat" id="chat-box">
        <div class="msg-wrap ai-wrap">
            <div class="bubble ai-bubble">नमस्ते! 🌟 मैं तैयार हूँ। बैकग्राउंड बटन भी अब काम करेगा। पूछिए! 😊</div>
        </div>
    </div>
    
    <div id="input-area">
        <div id="status" class="status">GeminiX सोच रहा है... 🤔</div>
        <div class="input-row">
            <div class="input-wrap">
                <input type="text" id="prompt" placeholder="यहाँ लिखें..." autocomplete="off">
            </div>
            <button id="send-btn" class="btn-send" onclick="ask()">SEND</button>
        </div>
    </div>
</div>

<script>
    // Theme Switcher Fix
    function toggleTheme() {
        document.body.classList.toggle('light-theme');
    }

    const KEYS = ["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"]; 
    let chatHistory = [{role: "system", content: "Reply in Hindi with emojis. Use markdown for tables."}];

    function copyText(btn, text) {
        navigator.clipboard.writeText(text);
        btn.innerText = "COPIED! ✅";
        setTimeout(() => { btn.innerText = "COPY 📋"; }, 2000);
    }

    async function ask() {
        const p = document.getElementById('prompt');
        const text = p.value.trim();
        if(!text) return;

        addMsg(text, 'user');
        p.value = "";
        document.getElementById('status').style.display = 'block';
        chatHistory.push({role: "user", content: text});

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${KEYS[0]}`, "Content-Type": "application/json" },
                body: JSON.stringify({ model: "llama-3.1-8b-instant", messages: chatHistory })
            });
            const data = await res.json();
            const reply = data.choices[0].message.content;
            chatHistory.push({role: "assistant", content: reply});
            addMsg(reply, 'ai');
        } catch (e) {
            addMsg("माफ़ करें, फिर से कोशिश करें। ❌", 'ai');
        } finally {
            document.getElementById('status').style.display = 'none';
        }
    }

    function addMsg(txt, sender) {
        const chat = document.getElementById('chat');
        const wrap = document.createElement('div');
        wrap.className = `msg-wrap ${sender}-wrap`;
        const bubble = document.createElement('div');
        bubble.className = `bubble ${sender}-bubble`;
        bubble.innerHTML = marked.parse(txt);
        wrap.appendChild(bubble);

        if(sender === 'ai') {
            const btn = document.createElement('button');
            btn.className = "copy-btn";
            btn.innerText = "COPY 📋";
            btn.onclick = () => copyText(btn, txt);
            wrap.appendChild(btn);
        }
        chat.appendChild(wrap);
        chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById('prompt').addEventListener('keypress', (e) => { if (e.key === 'Enter') ask(); });
</script>
</body>
    </html>
