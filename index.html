<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeminiX Pro AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #050505; --neon: #00ffa3; --card: #0d0d0d; --text: #ffffff; --user-bg: #00ffa3; }
        body.light-theme { --bg: #ffffff; --card: #f8f9fa; --text: #1a1a1a; --neon: #2563eb; --user-bg: #2563eb; }
        
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--text); overflow: hidden; position: fixed; width: 100%; }
        
        #app { display: flex; flex-direction: column; height: 100dvh; width: 100%; max-width: 600px; margin: auto; background: var(--card); }
        
        header { 
            padding: 10px 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            flex-shrink: 0; 
        }
        .brand { font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px var(--neon); font-size: 18px; position: absolute; left: 50%; transform: translateX(-50%); }
        #theme-btn { background: transparent; border: 1px solid var(--neon); color: var(--neon); border-radius: 50%; width: 35px; height: 35px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; z-index: 10; }
        
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        #chat::-webkit-scrollbar { display: none; }
        
        .msg-wrap { display: flex; flex-direction: column; width: 100%; }
        .user-wrap { align-items: flex-end; }
        .ai-wrap { align-items: flex-start; }
        
        /* CHOTA USER BUBBLE FIX */
        .bubble { 
            padding: 10px 16px; 
            border-radius: 20px; 
            font-size: 15px; 
            line-height: 1.4; 
            word-wrap: break-word; 
            max-width: 75%; 
            width: fit-content; 
            display: inline-block;
        }
        .user-bubble { background: var(--user-bg); color: #000; border-bottom-right-radius: 4px; font-weight: 500; }
        .ai-bubble { background: transparent; border-left: 3px solid var(--neon); padding-left: 12px; color: var(--text); max-width: 100%; }

        .action-btns { display: flex; gap: 8px; margin-top: 8px; margin-left: 12px; }
        .small-btn { background: rgba(255,255,255,0.05); border: 1px solid #444; color: var(--text); font-size: 10px; padding: 5px 10px; border-radius: 6px; cursor: pointer; }

        .loader-container { display: none; align-items: center; gap: 8px; padding: 10px 15px; }
        .spinner { width: 16px; height: 16px; border: 2px solid rgba(0, 255, 163, 0.2); border-top: 2px solid var(--neon); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #input-area { padding: 10px; background: var(--card); border-top: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
        .input-row { display: flex; gap: 8px; align-items: flex-end; }
        .input-wrap { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid #333; border-radius: 20px; padding: 2px 12px; max-height: 100px; overflow-y: auto; }
        textarea { width: 100%; background: transparent; border: none; color: var(--text); padding: 10px 0; outline: none; font-size: 16px; resize: none; height: 40px; display: block; }
        
        /* NEON SEND BUTTON */
        .btn-send { background: var(--neon); color: #000; border: none; padding: 10px 22px; border-radius: 25px; font-weight: 900; cursor: pointer; flex-shrink: 0; font-size: 14px; box-shadow: 0 0 10px rgba(0, 255, 163, 0.3); }
    </style>
</head>
<body class="dark-theme">

<div id="app">
    <header>
        <button id="theme-btn" onclick="toggleTheme()">🎨</button>
        <div class="brand">GEMINI<span style="color:var(--neon)">X</span> PRO</div>
        <div style="width:35px"></div>
    </header>
    
    <div id="chat">
        <div class="msg-wrap ai-wrap">
            <div class="bubble ai-bubble">नमस्ते! अब मैं सिर्फ शुद्ध हिंदी या शुद्ध इंग्लिश में जवाब दूँगी। पूछिए!</div>
        </div>
    </div>

    <div id="input-area">
        <div id="status-container" class="loader-container">
            <div class="spinner"></div>
            <div class="loader-text" style="font-size:11px; color:var(--neon)">Thinking...</div>
        </div>
        <div class="input-row">
            <div class="input-wrap">
                <textarea id="prompt" placeholder="Message GeminiX..." rows="1" oninput="autoGrow(this)"></textarea>
            </div>
            <button id="send-btn" class="btn-send" onclick="ask()">SEND</button>
        </div>
    </div>
</div>

<script>
    function toggleTheme() { document.body.classList.toggle('light-theme'); }
    function autoGrow(element) { element.style.height = "5px"; element.style.height = (element.scrollHeight) + "px"; }

    function speak(text) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text.replace(/[#*`_]/g, ''));
        utterance.lang = /[क-ह]/.test(text) ? 'hi-IN' : 'en-US';
        window.speechSynthesis.speak(utterance);
    }

    const API_KEY = "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"; 
    
    // STRICT PURE LANGUAGE COMMAND
    let chatHistory = [{
        role: "system", 
        content: "You are a professional AI. Rules: 1. If user speaks in Hindi, reply ONLY in pure Hindi (Devanagari). 2. If user speaks in English, reply ONLY in pure English. 3. NEVER mix languages (No Hinglish). 4. Be direct and helpful."
    }];

    async function ask() {
        const p = document.getElementById('prompt');
        const text = p.value.trim();
        if(!text) return;
        
        const userMsg = addMsg(text, 'user');
        p.value = ""; p.style.height = "40px";
        document.getElementById('status-container').style.display = 'flex';
        
        userMsg.scrollIntoView({ behavior: 'smooth', block: 'start' });
        chatHistory.push({role: "user", content: text});

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({ model: "llama-3.1-8b-instant", messages: chatHistory })
            });

            const data = await res.json();
            const reply = data.choices[0].message.content;
            chatHistory.push({role: "assistant", content: reply});
            const aiMsg = addMsg(reply, 'ai');
            setTimeout(() => { aiMsg.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);

        } catch (e) { addMsg("Error! ❌", 'ai'); }
        finally { document.getElementById('status-container').style.display = 'none'; }
    }

    function addMsg(txt, sender) {
        const chat = document.getElementById('chat');
        const wrap = document.createElement('div');
        wrap.className = `msg-wrap ${sender}-wrap`;
        const bubble = document.createElement('div');
        bubble.className = `bubble ${sender}-bubble`;
        bubble.innerHTML = marked.parse(txt);
        wrap.appendChild(bubble);

        if(sender === 'ai') {
            const btnDiv = document.createElement('div');
            btnDiv.className = "action-btns";
            const copyBtn = document.createElement('button');
            copyBtn.className = "small-btn"; copyBtn.innerHTML = "📋 Copy";
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(txt);
                copyBtn.innerHTML = "✅ Done";
                setTimeout(() => copyBtn.innerHTML = "📋 Copy", 2000);
            };
            const speakBtn = document.createElement('button');
            speakBtn.className = "small-btn"; speakBtn.innerHTML = "🔊 Listen";
            speakBtn.onclick = () => speak(txt);
            btnDiv.appendChild(copyBtn); btnDiv.appendChild(speakBtn);
            wrap.appendChild(btnDiv);
        }

        chat.appendChild(wrap);
        return wrap;
    }
</script>
</body>
</html>
