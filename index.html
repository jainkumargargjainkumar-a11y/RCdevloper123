<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeminiX AI Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #050505; --neon: #00ffa3; --card: #0d0d0d; --text: #ffffff; }
        body.light-theme { --bg: #f5f5f5; --card: #ffffff; --text: #1a1a1a; --neon: #2563eb; }
        body.blue-theme { --bg: #001220; --card: #001e30; --text: #e0f2fe; --neon: #38bdf8; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: 0.3s; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        #app { width: 100%; max-width: 600px; display: flex; flex-direction: column; background: var(--card); border-left: 1px solid #333; border-right: 1px solid #333; position: relative; }
        #theme-btn { position: absolute; left: 15px; top: 15px; width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--neon); background: transparent; color: var(--neon); cursor: pointer; z-index: 10; font-size: 20px; box-shadow: 0 0 10px var(--neon); }
        header { padding: 15px; text-align: center; border-bottom: 1px solid #333; background: rgba(0,0,0,0.2); font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px var(--neon); font-size: 20px; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; scrollbar-width: none; }
        .msg-wrap { display: flex; flex-direction: column; max-width: 90%; }
        .user-wrap { align-self: flex-end; }
        .ai-wrap { align-self: flex-start; width: 100%; }
        .bubble { padding: 12px 18px; border-radius: 18px; font-size: 15px; line-height: 1.6; }
        .user-bubble { background: rgba(0,0,0,0.05); border: 1px solid #444; border-bottom-right-radius: 2px; }
        .ai-bubble { background: transparent; border-left: 4px solid var(--neon); padding-left: 15px; }
        table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 14px; }
        th, td { border: 1px solid #444; padding: 8px; text-align: left; }
        th { color: var(--neon); background: rgba(0,0,0,0.1); }
        #input-area { padding: 20px; background: rgba(0,0,0,0.2); border-top: 1px solid #333; }
        .input-wrap { background: rgba(0,0,0,0.1); border: 2px solid #444; border-radius: 15px; margin-bottom: 12px; display: flex; }
        input { flex: 1; background: transparent; border: none; color: var(--text); padding: 15px; outline: none; font-size: 16px; }
        .btn-send { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid var(--neon); background: transparent; color: var(--neon); font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        .btn-send:hover { background: var(--neon); color: #000; box-shadow: 0 0 25px var(--neon); }
        .status { color: var(--neon); font-size: 12px; text-align: center; margin-bottom: 8px; display: none; }
        .copy-btn { font-size: 10px; opacity: 0.5; background: transparent; border: 1px solid #444; color: var(--text); padding: 3px 8px; border-radius: 4px; margin-top: 5px; cursor: pointer; width: fit-content; }
    </style>
</head>
<body>
<button id="theme-btn" onclick="toggleTheme()">🎨</button>
<div id="app">
    <header>GEMINI<span style="color:var(--neon)">X</span> PRO</header>
    <div id="chat">
        <div class="msg-wrap ai-wrap"><div class="bubble ai-bubble">नमस्ते! मैं आपका AI असिस्टेंट हूँ। मैं शुद्ध हिंदी और अंग्रेजी में बात कर सकता हूँ और टेबल भी बना सकता हूँ।</div></div>
    </div>
    <div id="input-area">
        <div id="status" class="status">GeminiX लिख रहा है...</div>
        <div class="input-wrap"><input type="text" id="prompt" placeholder="यहाँ संदेश लिखें..." autocomplete="off"></div>
        <button id="send-btn" class="btn-send" onclick="ask()">Send Message</button>
    </div>
</div>
<script>
    const KEYS = ["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"]; // Apni key yahan check karein
    let keyIdx = 0;
    let chatHistory = [{role: "system", content: "Reply in Pure Hindi (Devanagari) for Hindi queries. Use English for English. No Hinglish. Use Markdown tables. Keep context."}];
    function toggleTheme() { document.body.classList.toggle('light-theme'); }
    async function ask() {
        const p = document.getElementById('prompt');
        const text = p.value.trim();
        if(!text) return;
        addMsg(text, 'user');
        p.value = "";
        document.getElementById('status').style.display = 'block';
        chatHistory.push({role: "user", content: text});
        fetchAPI(text);
    }
    async function fetchAPI(text) {
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${KEYS[keyIdx]}`, "Content-Type": "application/json" },
                body: JSON.stringify({ model: "llama-3.1-8b-instant", messages: chatHistory })
            });
            const data = await res.json();
            const reply = data.choices[0].message.content;
            chatHistory.push({role: "assistant", content: reply});
            await typeWriter(reply);
        } catch (e) { addMsg("Error: Connection Failed.", 'ai'); }
        finally { document.getElementById('status').style.display = 'none'; }
    }
    async function typeWriter(text) {
        const chat = document.getElementById('chat');
        const wrap = document.createElement('div');
        wrap.className = `msg-wrap ai-wrap`;
        const bubble = document.createElement('div');
        bubble.className = `bubble ai-bubble`;
        wrap.appendChild(bubble);
        chat.appendChild(wrap);
        let current = "";
        const words = text.split(" ");
        for (let word of words) {
            current += word + " ";
            bubble.innerHTML = marked.parse(current);
            chat.scrollTop = chat.scrollHeight;
            await new Promise(r => setTimeout(r, 40));
        }
    }
    function addMsg(txt, sender) {
        const chat = document.getElementById('chat');
        const wrap = document.createElement('div');
        wrap.className = `msg-wrap ${sender}-wrap`;
        const bubble = document.createElement('div');
        bubble.className = `bubble ${sender}-bubble`;
        bubble.innerHTML = marked.parse(txt);
        wrap.appendChild(bubble);
        chat.appendChild(wrap);
        chat.scrollTop = chat.scrollHeight;
    }
</script>
</body>
</html>
