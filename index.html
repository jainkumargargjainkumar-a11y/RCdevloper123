<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeminiX Pro AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #050505; --neon: #00ffa3; --card: #0d0d0d; --text: #ffffff; }
        body.light-theme { --bg: #ffffff; --card: #f8f9fa; --text: #1a1a1a; --neon: #2563eb; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); overflow: hidden; position: fixed; width: 100%; }
        
        #app { display: flex; flex-direction: column; height: 100%; width: 100%; max-width: 600px; margin: auto; background: var(--card); }
        
        header { padding: 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px var(--neon); font-size: 18px; flex-shrink: 0; }
        
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        
        .msg-wrap { display: flex; flex-direction: column; max-width: 85%; }
        .user-wrap { align-self: flex-end; }
        .ai-wrap { align-self: flex-start; width: 100%; }
        
        .bubble { padding: 12px 16px; border-radius: 20px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
        .user-bubble { background: var(--neon); color: #000; border-bottom-right-radius: 2px; font-weight: 500; }
        .ai-bubble { background: rgba(255,255,255,0.05); border-left: 4px solid var(--neon); padding-left: 15px; }

        .action-btns { display: flex; gap: 10px; margin-top: 8px; }
        .small-btn { background: rgba(255,255,255,0.05); border: 1px solid #444; color: var(--text); font-size: 11px; padding: 6px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 5px; }

        #theme-btn { position: absolute; left: 10px; top: 12px; width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--neon); background: transparent; color: var(--neon); z-index: 100; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* LOADING SPINNER CSS */
        .loader-container { display: none; align-items: center; gap: 10px; padding-left: 15px; margin-bottom: 10px; }
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 255, 163, 0.2);
            border-top: 3px solid var(--neon);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-text { font-size: 12px; color: var(--neon); font-weight: bold; }

        #input-area { padding: 12px; background: var(--card); border-top: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
        .input-row { display: flex; gap: 10px; align-items: center; }
        .input-wrap { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid #333; border-radius: 30px; padding: 2px 15px; }
        input { width: 100%; background: transparent; border: none; color: var(--text); padding: 12px 0; outline: none; font-size: 16px; }
        
        .btn-send { background: var(--neon); color: #000; border: none; padding: 12px 22px; border-radius: 25px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<button id="theme-btn" onclick="toggleTheme()">🎨</button>

<div id="app">
    <header>GEMINI<span style="color:var(--neon)">X</span> PRO</header>
    
    <div id="chat">
        <div class="msg-wrap ai-wrap">
            <div class="bubble ai-bubble">नमस्ते! 🌟 I'm ready. I can translate, teach English, and speak back to you! Try asking something. 🔊</div>
        </div>
    </div>
    
    <div id="input-area">
        <div id="status-container" class="loader-container">
            <div class="spinner"></div>
            <div class="loader-text">GeminiX is thinking...</div>
        </div>
        
        <div class="input-row">
            <div class="input-wrap">
                <input type="text" id="prompt" placeholder="Type message..." autocomplete="off">
            </div>
            <button id="send-btn" class="btn-send" onclick="ask()">SEND</button>
        </div>
    </div>
</div>

<script>
    function toggleTheme() { document.body.classList.toggle('light-theme'); }

    function speak(text) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = /[a-zA-Z]{4,}/.test(text) ? 'en-US' : 'hi-IN';
        window.speechSynthesis.speak(utterance);
    }

    const KEYS = ["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"]; 
    let chatHistory = [{role: "system", content: "Multilingual assistant. If user speaks English, reply in English. If Hindi, reply in Hindi but with English learning tips. Use emojis."}];

    async function ask() {
        const p = document.getElementById('prompt');
        const text = p.value.trim();
        if(!text) return;

        addMsg(text, 'user');
        p.value = "";
        
        // Show Spinner
        document.getElementById('status-container').style.display = 'flex';
        chatHistory.push({role: "user", content: text});

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${KEYS[0]}`, "Content-Type": "application/json" },
                body: JSON.stringify({ model: "llama-3.1-8b-instant", messages: chatHistory })
            });
            const data = await res.json();
            const reply = data.choices[0].message.content;
            chatHistory.push({role: "assistant", content: reply});
            addMsg(reply, 'ai');
        } catch (e) {
            addMsg("Error: Server busy ❌", 'ai');
        } finally {
            // Hide Spinner
            document.getElementById('status-container').style.display = 'none';
        }
    }

    function addMsg(txt, sender) {
        const chat = document.getElementById('chat');
        const wrap = document.createElement('div');
        wrap.className = `msg-wrap ${sender}-wrap`;
        const bubble = document.createElement('div');
        bubble.className = `bubble ${sender}-bubble`;
        bubble.innerHTML = marked.parse(txt);
        wrap.appendChild(bubble);

        if(sender === 'ai') {
            const btnDiv = document.createElement('div');
            btnDiv.className = "action-btns";
            
            const copyBtn = document.createElement('button');
            copyBtn.className = "small-btn"; copyBtn.innerHTML = "📋 Copy";
            copyBtn.onclick = () => { navigator.clipboard.writeText(txt); copyBtn.innerHTML = "✅ Done"; setTimeout(()=>copyBtn.innerHTML="📋 Copy", 2000); };

            const speakBtn = document.createElement('button');
            speakBtn.className = "small-btn"; speakBtn.innerHTML = "🔊 Listen";
            speakBtn.onclick = () => speak(txt);

            btnDiv.appendChild(copyBtn);
            btnDiv.appendChild(speakBtn);
            wrap.appendChild(btnDiv);
        }
        chat.appendChild(wrap);
        chat.scrollTop = chat.scrollHeight;
    }
    document.getElementById('prompt').addEventListener('keypress', (e) => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
