<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeminiX Pro AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #050505; --neon: #00ffa3; --card: #0d0d0d; --text: #ffffff; --user-bg: #00ffa3; }
        body.light-theme { --bg: #ffffff; --card: #f8f9fa; --text: #1a1a1a; --neon: #2563eb; --user-bg: #2563eb; }
        
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body { height: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--text); overflow: hidden; position: fixed; width: 100%; }
        
        #app { display: flex; flex-direction: column; height: 100dvh; width: 100%; max-width: 600px; margin: auto; background: var(--card); }
        
        header { padding: 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px var(--neon); font-size: 18px; flex-shrink: 0; }
        
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        #chat::-webkit-scrollbar { display: none; }
        
        .msg-wrap { display: flex; flex-direction: column; width: 100%; margin-bottom: 5px; }
        .user-wrap { align-items: flex-end; }
        .ai-wrap { align-items: flex-start; }
        
        /* FIXED USER BUBBLE SIZE */
        .bubble { 
            padding: 10px 16px; 
            border-radius: 20px; 
            font-size: 15px; 
            line-height: 1.4; 
            word-wrap: break-word; 
            max-width: 80%; /* Screen ka sirf 80% lega */
            width: fit-content; /* Jitna bada text, utna bada bubble */
            display: inline-block;
        }
        .user-bubble { background: var(--user-bg); color: #000; border-bottom-right-radius: 4px; font-weight: 500; }
        .ai-bubble { background: transparent; border-left: 3px solid var(--neon); padding-left: 12px; color: var(--text); max-width: 100%; }

        pre { background: #111 !important; color: #00ffa3 !important; padding: 12px; border-radius: 10px; overflow-x: auto; margin: 10px 0; border: 1px solid #333; width: 100%; font-size: 13px; }

        .action-btns { display: flex; gap: 8px; margin-top: 5px; }
        .small-btn { background: rgba(255,255,255,0.05); border: 1px solid #444; color: var(--text); font-size: 10px; padding: 5px 10px; border-radius: 6px; cursor: pointer; }

        #theme-btn { position: absolute; left: 10px; top: 12px; width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--neon); background: transparent; color: var(--neon); z-index: 100; display: flex; align-items: center; justify-content: center; }

        .loader-container { display: none; align-items: center; gap: 8px; padding: 0 15px 10px 15px; }
        .spinner { width: 16px; height: 16px; border: 2px solid rgba(0, 255, 163, 0.2); border-top: 2px solid var(--neon); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #input-area { padding: 10px; background: var(--card); border-top: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
        .input-row { display: flex; gap: 8px; align-items: flex-end; }
        .input-wrap { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid #333; border-radius: 20px; padding: 2px 12px; max-height: 100px; overflow-y: auto; }
        textarea { width: 100%; background: transparent; border: none; color: var(--text); padding: 10px 0; outline: none; font-size: 16px; resize: none; height: 40px; display: block; line-height: 1.2; }
        
        .btn-send { background: var(--neon); color: #000; border: none; width: 40px; height: 40px; border-radius: 50%; font-weight: bold; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 0 10px rgba(0, 255, 163, 0.2); }
    </style>
</head>
<body>

<button id="theme-btn" onclick="toggleTheme()">🎨</button>

<div id="app">
    <header>GEMINI<span style="color:var(--neon)">X</span> PRO</header>
    <div id="chat">
        <div class="msg-wrap ai-wrap">
            <div class="bubble ai-bubble">नमस्ते! 🌟 Ab aapke message bubbles fix kar diye hain aur scroll bhi automatic hoga.</div>
        </div>
    </div>
    <div id="input-area">
        <div id="status-container" class="loader-container">
            <div class="spinner"></div>
            <div class="loader-text" style="font-size:11px; color:var(--neon)">Thinking...</div>
        </div>
        <div class="input-row">
            <div class="input-wrap">
                <textarea id="prompt" placeholder="Message..." rows="1" oninput="autoGrow(this)"></textarea>
            </div>
            <button id="send-btn" class="btn-send" onclick="ask()">➔</button>
        </div>
    </div>
</div>

<script>
    function toggleTheme() { document.body.classList.toggle('light-theme'); }
    function autoGrow(element) { element.style.height = "5px"; element.style.height = (element.scrollHeight) + "px"; }

    function speak(text) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text.replace(/[#*`_]/g, ''));
        utterance.lang = /[a-zA-Z]{4,}/.test(text) ? 'en-US' : 'hi-IN';
        window.speechSynthesis.speak(utterance);
    }

    const KEYS = ["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"]; 
    let chatHistory = [{role: "system", content: "Professional assistant. Reply in user's language."}];

    function scrollToBottom() {
        const chat = document.getElementById('chat');
        chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
    }

    async function ask() {
        const p = document.getElementById('prompt');
        const text = p.value.trim();
        if(!text) return;
        addMsg(text, 'user');
        p.value = ""; p.style.height = "40px";
        document.getElementById('status-container').style.display = 'flex';
        chatHistory.push({role: "user", content: text});

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${KEYS[0]}`, "Content-Type": "application/json" },
                body: JSON.stringify({ model: "llama-3.1-8b-instant", messages: chatHistory })
            });
            const data = await res.json();
            const reply = data.choices[0].message.content;
            chatHistory.push({role: "assistant", content: reply});
            addMsg(reply, 'ai');
        } catch (e) { addMsg("Error ❌", 'ai'); }
        finally { document.getElementById('status-container').style.display = 'none'; }
    }

    function addMsg(txt, sender) {
        const chat = document.getElementById('chat');
        const wrap = document.createElement('div');
        wrap.className = `msg-wrap ${sender}-wrap`;
        const bubble = document.createElement('div');
        bubble.className = `bubble ${sender}-bubble`;
        bubble.innerHTML = marked.parse(txt);
        wrap.appendChild(bubble);

        if(sender === 'ai') {
            const btnDiv = document.createElement('div');
            btnDiv.className = "action-btns";
            const copyBtn = document.createElement('button');
            copyBtn.className = "small-btn"; copyBtn.innerHTML = "📋 Copy";
            copyBtn.onclick = () => { navigator.clipboard.writeText(txt); };
            const speakBtn = document.createElement('button');
            speakBtn.className = "small-btn"; speakBtn.innerHTML = "🔊 Listen";
            speakBtn.onclick = () => speak(txt);
            btnDiv.appendChild(copyBtn); btnDiv.appendChild(speakBtn);
            wrap.appendChild(btnDiv);
        }
        chat.appendChild(wrap);
        
        // JAISE HI MESSAGE AAYE, NICHE CHALA JAYE
        setTimeout(scrollToBottom, 50);
    }
</script>
</body>
</html>
