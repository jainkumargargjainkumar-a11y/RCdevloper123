<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeminiX Pro AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #050505; --neon: #00ffa3; --card: #0d0d0d; --text: #ffffff; --user-bg: #1e1e1e; }
        body.light-theme { --bg: #ffffff; --card: #f8f9fa; --text: #1a1a1a; --neon: #2563eb; --user-bg: #e9ecef; }
        
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* 1. SCREEN KO LOCK KARNA (Main Screen Scroll nahi hogi) */
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            background: var(--bg); 
            color: var(--text); 
            overflow: hidden; /* Scroll band */
            position: fixed; 
            width: 100%; 
        }
        
        #app { 
            display: flex; 
            flex-direction: column; 
            height: 100dvh; /* Dynamic viewport height for mobile */
            width: 100%; 
            max-width: 600px; 
            margin: auto; 
            background: var(--card); 
        }
        
        header { 
            padding: 15px; 
            text-align: center; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            font-weight: 900; 
            letter-spacing: 2px; 
            text-shadow: 0 0 10px var(--neon); 
            font-size: 18px; 
            flex-shrink: 0; 
        }
        
        /* 2. CHAT AREA (Sirf ye khiska sakte hain) */
        #chat { 
            flex: 1; 
            overflow-y: auto; /* Sirf yahan scroll chalega */
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            -webkit-overflow-scrolling: touch; /* Smooth mobile scroll */
            scrollbar-width: none; 
        }
        #chat::-webkit-scrollbar { display: none; } /* Scrollbar chhupane ke liye */
        
        .msg-wrap { display: flex; flex-direction: column; width: 100%; }
        .user-wrap { align-items: flex-end; }
        .ai-wrap { align-items: flex-start; }
        
        .bubble { 
            padding: 10px 16px; 
            border-radius: 18px; 
            font-size: 15px; 
            line-height: 1.5; 
            word-wrap: break-word; 
            max-width: 85%;
            width: fit-content;
        }
        .user-bubble { background: var(--user-bg); color: var(--text); border-bottom-right-radius: 4px; }
        .ai-bubble { background: transparent; border-left: 3px solid var(--neon); padding-left: 15px; max-width: 100%; }

        /* Code Block Mere Jaisa */
        pre { 
            background: #111 !important; 
            color: #00ffa3 !important; 
            padding: 15px; 
            border-radius: 10px; 
            overflow-x: auto; 
            margin: 10px 0;
            border: 1px solid #333;
            width: 100%;
        }

        .action-btns { display: flex; gap: 10px; margin-top: 8px; }
        .small-btn { background: rgba(255,255,255,0.05); border: 1px solid #444; color: var(--text); font-size: 11px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }

        #theme-btn { position: absolute; left: 10px; top: 12px; width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--neon); background: transparent; color: var(--neon); z-index: 100; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        .loader-container { display: none; align-items: center; gap: 10px; padding-left: 15px; margin-bottom: 10px; }
        .spinner { width: 18px; height: 18px; border: 3px solid rgba(0, 255, 163, 0.2); border-top: 3px solid var(--neon); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Expanding Input Area */
        #input-area { padding: 12px; background: var(--card); border-top: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
        .input-row { display: flex; gap: 10px; align-items: flex-end; }
        .input-wrap { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid #333; border-radius: 20px; padding: 5px 15px; max-height: 120px; overflow-y: auto; }
        textarea { width: 100%; background: transparent; border: none; color: var(--text); padding: 8px 0; outline: none; font-size: 16px; resize: none; height: 40px; display: block; }
        
        .btn-send { background: var(--neon); color: #000; border: none; width: 42px; height: 42px; border-radius: 50%; font-weight: bold; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    </style>
</head>
<body>

<button id="theme-btn" onclick="toggleTheme()">🎨</button>

<div id="app">
    <header>GEMINI<span style="color:var(--neon)">X</span> PRO</header>
    <div id="chat">
        <div class="msg-wrap ai-wrap">
            <div class="bubble ai-bubble">नमस्ते! 🌟 Ab screen lock hai, aap sirf is chat ko upar-niche khiska sakte hain.</div>
        </div>
    </div>
    <div id="input-area">
        <div id="status-container" class="loader-container">
            <div class="spinner"></div>
            <div class="loader-text" style="font-size:12px; color:var(--neon)">Thinking...</div>
        </div>
        <div class="input-row">
            <div class="input-wrap">
                <textarea id="prompt" placeholder="Message GeminiX..." rows="1" oninput="autoGrow(this)"></textarea>
            </div>
            <button id="send-btn" class="btn-send" onclick="ask()">➔</button>
        </div>
    </div>
</div>

<script>
    function toggleTheme() { document.body.classList.toggle('light-theme'); }

    function autoGrow(element) {
        element.style.height = "5px";
        element.style.height = (element.scrollHeight) + "px";
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text.replace(/[#*`_]/g, ''));
        utterance.lang = /[a-zA-Z]{4,}/.test(text) ? 'en-US' : 'hi-IN';
        window.speechSynthesis.speak(utterance);
    }

    const KEYS = ["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"]; 
    let chatHistory = [{role: "system", content: "Professional female assistant. Use code blocks for code. Reply in user's language."}];

    async function ask() {
        const p = document.getElementById('prompt');
        const text = p.value.trim();
        if(!text) return;
        addMsg(text, 'user');
        p.value = "";
        p.style.height = "40px";
        document.getElementById('status-container').style.display = 'flex';
        chatHistory.push({role: "user", content: text});

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${KEYS[0]}`, "Content-Type": "application/json" },
                body: JSON.stringify({ model: "llama-3.1-8b-instant", messages: chatHistory })
            });
            const data = await res.json();
            const reply = data.choices[0].message.content;
            chatHistory.push({role: "assistant", content: reply});
            addMsg(reply, 'ai');
        } catch (e) { addMsg("Error ❌", 'ai'); }
        finally { document.getElementById('status-container').style.display = 'none'; }
    }

    function addMsg(txt, sender) {
        const chat = document.getElementById('chat');
        const wrap = document.createElement('div');
        wrap.className = `msg-wrap ${sender}-wrap`;
        const bubble = document.createElement('div');
        bubble.className = `bubble ${sender}-bubble`;
        bubble.innerHTML = marked.parse(txt);
        wrap.appendChild(bubble);

        if(sender === 'ai') {
            const btnDiv = document.createElement('div');
            btnDiv.className = "action-btns";
            const copyBtn = document.createElement('button');
            copyBtn.className = "small-btn"; copyBtn.innerHTML = "📋 Copy";
            copyBtn.onclick = () => { navigator.clipboard.writeText(txt); };
            const speakBtn = document.createElement('button');
            speakBtn.className = "small-btn"; speakBtn.innerHTML = "🔊 Listen";
            speakBtn.onclick = () => speak(txt);
            btnDiv.appendChild(copyBtn); btnDiv.appendChild(speakBtn);
            wrap.appendChild(btnDiv);
        }
        chat.appendChild(wrap);
        
        // AUTO-SCROLL
        setTimeout(() => {
            chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
        }, 100);
    }
</script>
</body>
                </html>
