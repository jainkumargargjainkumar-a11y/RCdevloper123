<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeminiX Pro AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #050505; --neon: #00ffa3; --card: #0d0d0d; --text: #ffffff; }
        body.light-theme { --bg: #f5f5f5; --card: #ffffff; --text: #1a1a1a; --neon: #2563eb; }
        
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: 0.3s; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        
        #app { width: 100%; max-width: 600px; display: flex; flex-direction: column; background: var(--card); border-left: 1px solid #333; border-right: 1px solid #333; position: relative; height: 100vh; }
        
        #theme-btn { position: absolute; left: 10px; top: 10px; width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--neon); background: transparent; color: var(--neon); cursor: pointer; z-index: 10; font-size: 16px; }
        
        header { padding: 15px; text-align: center; border-bottom: 1px solid #333; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px var(--neon); font-size: 18px; }
        
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 20px; scrollbar-width: none; }
        
        .msg-wrap { display: flex; flex-direction: column; max-width: 85%; }
        .user-wrap { align-self: flex-end; }
        .ai-wrap { align-self: flex-start; width: 100%; }
        
        .bubble { padding: 10px 15px; border-radius: 15px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        .user-bubble { background: rgba(255,255,255,0.1); border: 1px solid #444; border-bottom-right-radius: 2px; }
        .ai-bubble { background: transparent; border-left: 3px solid var(--neon); padding-left: 12px; }

        #input-area { padding: 10px; background: var(--card); border-top: 1px solid #333; width: 100%; }
        .input-row { display: flex; gap: 8px; align-items: center; }
        
        .input-wrap { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid #444; border-radius: 25px; display: flex; overflow: hidden; }
        input { flex: 1; background: transparent; border: none; color: var(--text); padding: 12px 15px; outline: none; font-size: 15px; }
        
        .btn-send { background: var(--neon); color: #000; border: none; padding: 12px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-send:active { opacity: 0.8; }

        .status { color: var(--neon); font-size: 11px; text-align: center; margin-bottom: 5px; display: none; }
        table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 12px; }
        th, td { border: 1px solid #444; padding: 6px; text-align: left; }
    </style>
</head>
<body>

<button id="theme-btn" onclick="toggleTheme()">🎨</button>

<div id="app">
    <header>GEMINI<span style="color:var(--neon)">X</span> PRO</header>
    <div id="chat">
        <div class="msg-wrap ai-wrap"><div class="bubble ai-bubble">नमस्ते! मैं आपका AI असिस्टेंट हूँ। पूछिए, मैं आपकी क्या मदद कर सकता हूँ?</div></div>
    </div>
    
    <div id="input-area">
        <div id="status" class="status">GeminiX लिख रहा है...</div>
        <div class="input-row">
            <div class="input-wrap">
                <input type="text" id="prompt" placeholder="यहाँ पूछें..." autocomplete="off">
            </div>
            <button id="send-btn" class="btn-send" onclick="ask()">SEND</button>
        </div>
    </div>
</div>

<script>
    // Apni API Key yahan brackets ke andar dalein
    const KEYS = ["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"]; 
    let keyIdx = 0;
    let chatHistory = [{role: "system", content: "Reply in Pure Hindi for Hindi, English for English. Use Markdown tables for data. Be brief."}];

    function toggleTheme() { document.body.classList.toggle('light-theme'); }

    async function ask() {
        const p = document.getElementById('prompt');
        const text = p.value.trim();
        if(!text) return;

        addMsg(text, 'user');
        p.value = "";
        document.getElementById('status').style.display = 'block';
        chatHistory.push({role: "user", content: text});

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${KEYS[keyIdx]}`, "Content-Type": "application/json" },
                body: JSON.stringify({ model: "llama-3.1-8b-instant", messages: chatHistory })
            });
            const data = await res.json();
            const reply = data.choices[0].message.content;
            chatHistory.push({role: "assistant", content: reply});
            await typeWriter(reply);
        } catch (e) {
            addMsg("Error: Connection Failed. Please check your API Key.", 'ai');
        } finally {
            document.getElementById('status').style.display = 'none';
        }
    }

    async function typeWriter(text) {
        const chat = document.getElementById('chat');
        const wrap = document.createElement('div');
        wrap.className = `msg-wrap ai-wrap`;
        const bubble = document.createElement('div');
        bubble.className = `bubble ai-bubble`;
        wrap.appendChild(bubble);
        chat.appendChild(wrap);

        let current = "";
        const words = text.split(" ");
        for (let word of words) {
            current += word + " ";
            bubble.innerHTML = marked.parse(current);
            chat.scrollTop = chat.scrollHeight;
            await new Promise(r => setTimeout(r, 30));
        }
    }

    function addMsg(txt, sender) {
        const chat = document.getElementById('chat');
        const wrap = document.createElement('div');
        wrap.className = `msg-wrap ${sender}-wrap`;
        const bubble = document.createElement('div');
        bubble.className = `bubble ${sender}-bubble`;
        bubble.innerHTML = marked.parse(txt);
        wrap.appendChild(bubble);
        chat.appendChild(wrap);
        chat.scrollTop = chat.scrollHeight;
    }

    // Enter key support
    document.getElementById('prompt').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') ask();
    });
</script>
</body>
</html>
